<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baghchal Game - Modern UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%); margin: 0; padding: 20px; box-sizing: border-box; }
        .game-container {
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15), 0 5px 15px rgba(0, 0, 0, 0.1);
            padding: 35px;
            display: flex;
            flex-direction: row;
            gap: 30px;
            align-items: center;
            max-width: 95%;
            width: fit-content;
            text-align: center;
            border: 1px solid #e0e7eb;
            transition: transform 0.3s ease-in-out;
        }
        .game-container:hover { transform: translateY(-5px); }
        .game-main-content { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
        .game-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: #2c3e50;
            margin-bottom: 25px;
            letter-spacing: -0.5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }
        canvas {
            background-color: #f8fafc;
            border-radius: 12px;
            border: 3px solid #cbd5e1;
            touch-action: manipulation;
            width: 100%;
            max-width: 400px;
            height: auto;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
            transition: border-color 0.3s ease;
        }
        .game-sidebar {
            background-color: #f0f4f8;
            border-radius: 15px;
            padding: 25px;
            width: 250px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #d9e2ec;
        }
        /* .message-box styles are no longer needed as the element is removed */
        .button-group { display: flex; flex-direction: column; gap: 15px; width: 100%; }
        button { background: linear-gradient(180deg, #4299e1 0%, #2b6cb0 100%); color: white; padding: 18px 35px; border: none; border-radius: 10px; font-size: 1.2rem; font-weight: 700; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2); text-transform: uppercase; letter-spacing: 0.5px; position: relative; overflow: hidden; z-index: 1; width: 100%; }
        button:before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.1); transition: transform 0.4s ease; transform: scaleX(0); transform-origin: left; z-index: -1; }
        button:hover:before { transform: scaleX(1); }
        button:hover { background: linear-gradient(180deg, #2b6cb0 0%, #4299e1 100%); transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25); }
        button:active { transform: translateY(0); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15); }
        button:disabled { background: #cbd5e1; color: #a0aec0; cursor: not-allowed; box-shadow: none; transform: none; opacity: 0.8; }
        @media (max-width: 850px) {
            .game-container { flex-direction: column; align-items: center; padding: 25px; gap: 25px; max-width: 100%; width: fit-content; }
            .game-sidebar { width: 100%; max-width: 400px; }
            .game-title { font-size: 2rem; margin-bottom: 20px; }
            /* .message-box styles for media query no longer needed */
            button { padding: 12px 20px; font-size: 1.1rem; }
        }

        /* Styling for goat residing and killed areas */
        .goat-status-section {
            margin-top: 5px; /* Adjust margin if needed due to message box removal */
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #fcfdff;
            text-align: left;
        }

        .residing-goats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            width: 100%;
        }

        .goat-slot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid #a0aec0;
            background-color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-sizing: border-box;
        }

        .goat-slot img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        
        .goat-slot.available-goat {
            box-shadow: 0 0 5px rgba(47, 133, 90, 0.5);
        }

        .killed-goats-row {
            display: flex;
            justify-content: flex-start;
            gap: 8px;
            width: 100%;
            flex-wrap: wrap;
        }

        .killed-goat-slot.filled-red {
            box-shadow: 0 0 5px rgba(197, 48, 48, 0.5);
        }

        /* Toast Notification Styles */
        #toastNotification {
            visibility: hidden; /* Hidden by default. Fade this out. */
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 1000; /* High z-index to be on top */
            top: 30px; /* Position from top */
            left: 50%; /* Center horizontally */
            transform: translateX(-50%) translateY(-20px); /* Adjust initial position for top center */
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.25);
            opacity: 0;
            transition: visibility 0s, opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }

        #toastNotification.show {
            visibility: visible;
            opacity: 1;
            transform: translateX(-50%) translateY(0); /* Move to final position */
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-main-content">
            <h1 id="gameTitle" class="game-title">Baghchal</h1>
            <canvas id="gameCanvas"></canvas>
        </div>
        <div class="game-sidebar">
            <div class="goat-status-section">
                <div id="residingGoatsContainer" class="residing-goats-grid">
                    </div>
            </div>

            <div class="goat-status-section">
                <div id="killedGoatsContainer" class="killed-goats-row">
                    </div>
            </div>

            <div class="button-group">
                <button id="resetButton" disabled>Reset Game</button>
                <button id="undoButton" disabled>Undo Move</button>
            </div>
        </div>
    </div>
    
    <div id="toastNotification"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        // Removed: const messageBox = document.getElementById('messageBox'); 
        const resetButton = document.getElementById('resetButton');
        const undoButton = document.getElementById('undoButton');
        const gameTitle = document.getElementById('gameTitle');
        
        const residingGoatsContainer = document.getElementById('residingGoatsContainer');
        const killedGoatsContainer = document.getElementById('killedGoatsContainer');
        const toastNotification = document.getElementById('toastNotification');

        const socket = io();
        let playerRole = '';
        let room = '';
        let selectedPiece = null;

        let gameState = {};
        let gameOver = false;
        
        const CELL_SIZE = 80;
        const CANVAS_WIDTH = 5 * CELL_SIZE;
        const CANVAS_HEIGHT = 5 * CELL_SIZE;
        canvas.width = CANVAS_WIDTH;
        canvas.height = CANVAS_HEIGHT;

        const TIGER_COLOR = '#e67e22';
        const GOAT_COLOR = '#27ae60';
        const KILLED_GOAT_COLOR = '#e53e3e';
        const SELECTED_COLOR = '#3498db';
        const BOARD_LINE_COLOR = '#7f8c8d';
        const BOARD_POINT_COLOR = '#34495e';

        const TIGER_TITLE_COLOR = '#e67e22';
        const GOAT_TITLE_COLOR = '#27ae60';

        const TIGER_CANVAS_BORDER_COLOR = TIGER_COLOR;
        const GOAT_CANVAS_BORDER_COLOR = GOAT_COLOR;
        const DEFAULT_CANVAS_BORDER_COLOR = '#cbd5e1';


        const tigerImage = new Image();
        const goatImage = new Image();
        const killedGoatImage = new Image();

        tigerImage.src = `data:image/svg+xml;base64,${btoa(`<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="100" height="100" fill="transparent"/><circle cx="50" cy="50" r="45" fill="${TIGER_COLOR}"/><path d="M40 25 L35 35 M60 25 L65 35 M30 45 L40 50 M70 45 L60 50" stroke="rgba(0,0,0,0.4)" stroke-width="3" stroke-linecap="round"/><path d="M30 20 L40 30 L45 15 Z" fill="#b95d10"/><path d="M70 20 L60 30 L55 15 Z" fill="#b95d10"/><circle cx="50" cy="55" r="15" fill="#f5cba7"/><path d="M47 50 L53 50 L50 55 Z" fill="black"/><circle cx="40" cy="40" r="5" fill="black"/><circle cx="60" cy="40" r="5" fill="black"/></svg>`)}`;
        goatImage.src = `data:image/svg+xml;base64,${btoa(`<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="100" height="100" fill="transparent"/><circle cx="50" cy="50" r="45" fill="${GOAT_COLOR}"/><path d="M35 50 Q50 40 65 50 Q50 65 35 50 Z" fill="#f0f0f0"/><path d="M25 45 L35 40 L40 55 Z" fill="#d0d0d0"/><path d="M75 45 L65 40 L60 55 Z" fill="#d0d0d0"/><path d="M30 35 Q35 20 40 35 Z" fill="#8b4513"/><path d="M70 35 Q65 20 60 35 Z" fill="#8b4513"/><circle cx="42" cy="48" r="4" fill="black"/><circle cx="58" cy="48" r="4" fill="black"/></svg>`)}`;
        killedGoatImage.src = `data:image/svg+xml;base64,${btoa(`<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="100" height="100" fill="transparent"/><circle cx="50" cy="50" r="45" fill="${KILLED_GOAT_COLOR}"/><path d="M35 50 Q50 40 65 50 Q50 65 35 50 Z" fill="#f0f0f0"/><path d="M25 45 L35 40 L40 55 Z" fill="#d0d0d0"/><path d="M75 45 L65 40 L60 55 Z" fill="#d0d0d0"/><path d="M30 35 Q35 20 40 35 Z" fill="#8b4513"/><path d="M70 35 Q65 20 60 35 Z" fill="#8b4513"/><circle cx="42" cy="48" r="4" fill="black"/><circle cx="58" cy="48" r="4" fill="black"/></svg>`)}`;


        // --- SOCKET.IO EVENT HANDLERS ---
        socket.on('waiting', (message) => {
            // displayMessage(message); // Removed message box, so this is commented out
            showToast("Waiting for opponent...", 5000);
            resetTitleStyle();
            resetCanvasBorderColor();
            updateGoatStatusDisplays(0, 0);
        });

        socket.on('gameStart', (data) => {
            playerRole = data.role;
            room = data.room;
            resetButton.disabled = false;
            undoButton.disabled = false;
            canvas.addEventListener('click', handleClick);
            updateLocalState(data.state, null);
            updateTitleStyle();
            updateCanvasBorderColor();
            updateGoatStatusDisplays(data.state.goats_placed, data.state.goats_killed);
            showToast("Opponent connected! Game starting...", 5000);
        });
        
        socket.on('gameStateUpdate', (data) => {
            updateLocalState(data.state, data.winner);
            updateCanvasBorderColor();
            updateGoatStatusDisplays(data.state.goats_placed, data.state.goats_killed);
        });

        socket.on('invalidMove', (data) => {
            // displayMessage(data.message, 'Invalid move. Please try again.', ''); // Removed message box
            showToast(data.message || 'Invalid move. Please try again.', 3000); // Use toast for invalid move
            selectedPiece = null;
            updateBoard();
        });

        socket.on('opponentDisconnected', (message) => {
            gameOver = true;
            // displayMessage(message, 'Game Over.', 'Please refresh to play again.'); // Removed message box
            showToast(message || "Your opponent has disconnected.", 7000);
            resetButton.disabled = true;
            undoButton.disabled = true;
            canvas.removeEventListener('click', handleClick);
            resetTitleStyle();
            resetCanvasBorderColor();
            updateGoatStatusDisplays(0, 0);
        });
        
        // --- HELPER FUNCTIONS ---
        // Removed displayMessage function as messageBox is gone
        // function displayMessage(msg1, msg2 = '', msg3 = '') {
        //     messageBox.innerHTML = `${msg1}<br>${msg2}<br>${msg3}`;
        // }
        
        function updateLocalState(newState, winner) {
            gameState = newState;
            gameOver = !!winner;
            selectedPiece = null;
            updateBoard();
            
            if (winner) {
                // displayMessage(`${winner} wins!`, '', 'Click Reset to start a new game.'); // Removed message box
                showToast(`${winner} wins! Click Reset to start a new game.`, 7000); // Use toast for game end
                canvas.removeEventListener('click', handleClick);
                resetTitleStyle();
                resetCanvasBorderColor();
                updateGoatStatusDisplays(newState.goats_placed, newState.goats_killed);
            } else {
                // updateTurnMessage(); // No longer needed as turn message was in message box
            }
        }
        
        // Removed updateTurnMessage function as messageBox is gone
        // function updateTurnMessage() {
        //     const isMyTurn = (playerRole === gameState.turn);
        //     const turnText = isMyTurn ? "Your turn" : "Opponent's turn";
            
        //     if (gameState.turn === 'G') {
        //         if (gameState.goats_placed < 20) {
        //             displayMessage(`You are: ${playerRole === 'G' ? 'Goat' : 'Tiger'}`, `Goats to place: ${20 - gameState.goats_placed}`, turnText);
        //         } else {
        //             displayMessage(`You are: ${playerRole === 'G' ? 'Goat' : 'Tiger'}`, `Goats killed: ${gameState.goats_killed}`, turnText);
        //         }
        //     } else { // Tiger's turn
        //          displayMessage(`You are: ${playerRole === 'T' ? 'Tiger' : 'Goat'}`, `Goats killed: ${gameState.goats_killed}`, turnText);
        //     }
        // }

        function updateTitleStyle() {
            let textColor = '';
            if (playerRole === 'T') {
                textColor = TIGER_TITLE_COLOR;
            } else if (playerRole === 'G') {
                textColor = GOAT_TITLE_COLOR;
            }

            if (textColor) {
                gameTitle.style.color = textColor;
                gameTitle.style.textShadow = 'none';
            }
        }

        function resetTitleStyle() {
            gameTitle.style.color = '#2c3e50';
            gameTitle.style.textShadow = '1px 1px 2px rgba(0,0,0,0.05)';
        }

        function updateCanvasBorderColor() {
            if (gameState.turn === 'T') {
                canvas.style.borderColor = TIGER_CANVAS_BORDER_COLOR;
            } else if (gameState.turn === 'G') {
                canvas.style.borderColor = GOAT_CANVAS_BORDER_COLOR;
            } else {
                canvas.style.borderColor = DEFAULT_CANVAS_BORDER_COLOR;
            }
        }

        function resetCanvasBorderColor() {
            canvas.style.borderColor = DEFAULT_CANVAS_BORDER_COLOR;
        }

        function updateGoatStatusDisplays(goatsPlaced, goatsKilled) {
            residingGoatsContainer.innerHTML = '';
            for (let i = 0; i < 20; i++) {
                const goatSlot = document.createElement('div');
                goatSlot.classList.add('goat-slot');
                if (i < (20 - goatsPlaced)) {
                    const img = document.createElement('img');
                    img.src = goatImage.src;
                    img.alt = 'Goat';
                    goatSlot.appendChild(img);
                    goatSlot.classList.add('available-goat');
                } else {
                    goatSlot.classList.add('placed');
                }
                residingGoatsContainer.appendChild(goatSlot);
            }

            killedGoatsContainer.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                const killedSlot = document.createElement('div');
                killedSlot.classList.add('goat-slot');
                if (i < goatsKilled) {
                    const img = document.createElement('img');
                    img.src = killedGoatImage.src;
                    img.alt = 'Killed Goat';
                    killedSlot.appendChild(img);
                    killedSlot.classList.add('filled-red');
                }
                killedGoatsContainer.appendChild(killedSlot);
            }
        }

        let toastTimeout;
        function showToast(message, duration = 3000) {
            clearTimeout(toastTimeout);
            toastNotification.textContent = message;
            toastNotification.classList.add('show');

            toastTimeout = setTimeout(() => {
                toastNotification.classList.remove('show');
            }, duration);
        }

        // --- DRAWING FUNCTIONS (Unchanged for board) ---
        function is_even(number) { return number % 2 === 0; }
        
        function drawBoard() {
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            ctx.strokeStyle = BOARD_LINE_COLOR;
            ctx.lineWidth = 2;
            for (let i = 0; i < 5; i++) {
                for (let j = 0; j < 5; j++) {
                    const x = j * CELL_SIZE + CELL_SIZE / 2;
                    const y = i * CELL_SIZE + CELL_SIZE / 2;
                    if (j < 4) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo((j + 1) * CELL_SIZE + CELL_SIZE / 2, y); ctx.stroke(); }
                    if (i < 4) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, (i + 1) * CELL_SIZE + CELL_SIZE / 2); ctx.stroke(); }
                    if (is_even(i + j)) {
                        if (i < 4 && j < 4) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo((j + 1) * CELL_SIZE + CELL_SIZE / 2, (i + 1) * CELL_SIZE + CELL_SIZE / 2); ctx.stroke(); }
                        if (i < 4 && j > 0) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo((j - 1) * CELL_SIZE + CELL_SIZE / 2, (i + 1) * CELL_SIZE + CELL_SIZE / 2); ctx.stroke(); }
                    }
                }
            }
            ctx.fillStyle = BOARD_POINT_COLOR;
            for (let i = 0; i < 5; i++) {
                for (let j = 0; j < 5; j++) {
                    const x = j * CELL_SIZE + CELL_SIZE / 2;
                    const y = i * CELL_SIZE + CELL_SIZE / 2;
                    ctx.beginPath();
                    ctx.arc(x, y, 5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        function drawPieces() {
            if (!gameState.board) return;
            const pieceSize = CELL_SIZE * 0.6;
            const offset = (CELL_SIZE - pieceSize) / 2;
            for (let i = 0; i < 5; i++) {
                for (let j = 0; j < 5; j++) {
                    const x = j * CELL_SIZE + offset;
                    const y = i * CELL_SIZE + offset;
                    const centerX = j * CELL_SIZE + CELL_SIZE / 2;
                    const centerY = i * CELL_SIZE + CELL_SIZE / 2;
                    const piece = gameState.board[i][j];

                    if (piece === 'T') {
                        ctx.drawImage(tigerImage, x, y, pieceSize, pieceSize);
                    } else if (piece === 'G') {
                        ctx.drawImage(goatImage, x, y, pieceSize, pieceSize);
                    }
                    
                    if (selectedPiece && selectedPiece[0] === i && selectedPiece[1] === j) {
                        ctx.beginPath();
                        ctx.arc(centerX, centerY, CELL_SIZE / 2 - 5, 0, Math.PI * 2);
                        ctx.strokeStyle = SELECTED_COLOR;
                        ctx.lineWidth = 5;
                        ctx.stroke();
                    }
                }
            }
        }

        function updateBoard() {
            drawBoard();
            drawPieces();
        }
        
        // --- EVENT HANDLERS ---
        function handleClick(event) {
            if (gameOver || playerRole !== gameState.turn) return;

            const rect = canvas.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            const row = Math.floor(y / (rect.height / 5));
            const col = Math.floor(x / (rect.width / 5));

            if (row < 0 || row >= 5 || col < 0 || col >= 5) return;

            const clickedPiece = gameState.board[row][col];

            // Goat placement phase
            if (playerRole === 'G' && gameState.goats_placed < 20) {
                if (clickedPiece === '.') {
                    socket.emit('makeMove', { room, move: { start_row: row, start_col: col, end_row: row, end_col: col } });
                }
                return;
            }

            // Piece selection and movement phase
            if (!selectedPiece) {
                // Select a piece if it belongs to the current player
                if (clickedPiece === playerRole) {
                    selectedPiece = [row, col];
                    updateBoard();
                }
            } else {
                // A piece is already selected, try to move it
                const [start_row, start_col] = selectedPiece;
                if (clickedPiece === '.') { // Can only move to empty spots
                    socket.emit('makeMove', { room, move: { start_row, start_col, end_row: row, end_col: col } });
                } else {
                    // Clicked on something else, deselect
                    selectedPiece = null;
                    updateBoard();
                }
            }
        }

        resetButton.addEventListener('click', () => socket.emit('resetGame', { room }));
        undoButton.addEventListener('click', () => socket.emit('undoMove', { room }));

        // --- INITIALIZATION ---
        Promise.all([
            new Promise(resolve => tigerImage.onload = resolve),
            new Promise(resolve => goatImage.onload = resolve),
            new Promise(resolve => killedGoatImage.onload = resolve)
        ]).then(() => {
            updateBoard();
            resetTitleStyle();
            resetCanvasBorderColor();
            updateGoatStatusDisplays(0, 0);
        }).catch(err => {
            console.error("Error loading images:", err);
            updateBoard();
            updateGoatStatusDisplays(0, 0);
        });
        
    </script>
</body>
</html>
